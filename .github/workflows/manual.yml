name: Build GE-Proton AppImage (Manual)

on:
  workflow_dispatch:
    inputs:
      ge_version:
        description: 'Version Name (e.g., GE-Proton9-23)'
        required: true
        default: 'GE-Proton-Custom'
      download_url:
        description: 'Direct link to the .tar.gz file'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tar wget

      - name: Set Environment Variables
        run: |
          echo "GE_VERSION=${{ github.event.inputs.ge_version }}" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=${{ github.event.inputs.download_url }}" >> $GITHUB_ENV
          echo "FINAL_NAME=${{ github.event.inputs.ge_version }}-standalone.AppImage" >> $GITHUB_ENV

      - name: Fetch and Extract GE-Proton
        run: |
          mkdir -p AppDir/opt/GE-Proton
          wget -qO archive.tar "${{ env.DOWNLOAD_URL }}"
          tar -xf archive.tar -C AppDir/opt/GE-Proton --strip-components=1
          rm archive.tar

      - name: Download go-appimage appimagetool
        run: |
          # Automatically fetch the latest continuous appimagetool from go-appimage releases
          TOOL_URL=$(wget -q https://github.com/probonopd/go-appimage/releases/expanded_assets/continuous -O - | grep -oP 'href="/probonopd/go-appimage/releases/download/continuous/\K[^"]+appimagetool[^"]*-x86_64\.AppImage' | head -n 1)
          if [ -z "$TOOL_URL" ]; then
            # Fallback direct query method
            wget -q https://github.com/probonopd/go-appimage/releases/download/continuous/appimagetool-current-x86_64.AppImage -O appimagetool.AppImage
          else
            wget -q "https://github.com$TOOL_URL" -O appimagetool.AppImage
          fi
          chmod +x appimagetool.AppImage

      - name: Build AppImage with go-appimage
        run: |
          # go-appimage appimagetool syntax requires explicit ARCH and VERSION
          ARCH=x86_64 VERSION="${{ env.GE_VERSION }}" ./appimagetool.AppImage AppDir

      - name: Rename Output Safely
        run: |
          # Find the generated AppImage while ignoring the tool binary
          GENERATED_FILE=$(find . -maxdepth 1 -name "*.AppImage" ! -name "appimagetool.AppImage" -print -quit)
          mv "$GENERATED_FILE" "${{ env.FINAL_NAME }}"

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GE_VERSION }}
          name: Release ${{ env.GE_VERSION }} Standalone AppImage
          files: "${{ env.FINAL_NAME }}"
          body: "Manual standalone build of ${{ env.GE_VERSION }}\n\nSource: ${{ env.DOWNLOAD_URL }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
