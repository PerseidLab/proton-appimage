name: Build Proton AppImage
on:
  workflow_dispatch:
    inputs:
      ge_version:
        description: "Version name, for example Proton9-23"
        required: true
        default: "Proton-Custom"
        type: string

      download_url:
        description: "Direct link to the Proton archive"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GE_VERSION: ${{ inputs.ge_version }}
      DOWNLOAD_URL: ${{ inputs.download_url }}
      FINAL_NAME: ${{ inputs.ge_version }}-standalone.AppImage

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            jq \
            tar

      - name: Fetch and extract Proton
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p AppDir/opt/Proton

          echo "Downloading Proton from:"
          echo "$DOWNLOAD_URL"

          curl \
            --fail \
            --location \
            --progress-bar \
            --output archive.tar \
            "$DOWNLOAD_URL"

          test -s archive.tar

          tar \
            --extract \
            --file=archive.tar \
            --directory=AppDir/opt/Proton \
            --strip-components=1

          rm -f archive.tar

      - name: Download latest go-appimage appimagetool
        shell: bash
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/probonopd/go-appimage/releases/tags/continuous"

          echo "Finding the latest x86_64 appimagetool asset..."

          TOOL_URL="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Accept: application/vnd.github+json" \
              "$API_URL" |
            jq -r '
              [
                .assets[]
                | select(
                    .name
                    | test("^appimagetool-[0-9]+-x86_64\\.AppImage$")
                  )
              ]
              | first
              | .browser_download_url // empty
            '
          )"

          if [ -z "$TOOL_URL" ]; then
            echo "Error: no x86_64 appimagetool asset was found."
            exit 1
          fi

          echo "Downloading:"
          echo "$TOOL_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --output appimagetool.AppImage \
            "$TOOL_URL"

          test -s appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          ARCH=x86_64 \
          VERSION="$GE_VERSION" \
          ./appimagetool.AppImage AppDir

      - name: Rename output
        shell: bash
        run: |
          set -euo pipefail

          GENERATED_FILE="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name "*.AppImage" \
              ! -name "appimagetool.AppImage" \
              -print \
              -quit
          )"

          if [ -z "$GENERATED_FILE" ]; then
            echo "Error: appimagetool did not produce an AppImage."
            exit 1
          fi

          mv "$GENERATED_FILE" "$FINAL_NAME"

          echo "Created $FINAL_NAME"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GE_VERSION }}
          name: Release ${{ env.GE_VERSION }} Standalone AppImage
          files: ${{ env.FINAL_NAME }}
          body: |
            AppImage build of ${{ env.GE_VERSION }}

            Source: ${{ env.DOWNLOAD_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
